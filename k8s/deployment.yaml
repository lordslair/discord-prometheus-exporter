apiVersion: apps/v1
kind: Deployment

metadata:
  namespace: monitoring
  name: discord-prometheus-exporter
  labels:
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discord
      tier: backend
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: discord
        tier: backend
    spec:
      restartPolicy: Always

      containers:
      - name: discord-prometheus-exporter
        image: lordslair/discord-prometheus-exporter:latest
        imagePullPolicy: Always
        resources:
          limits:
            memory: 64Mi
            cpu: 100m
          requests:
            memory: 32Mi
            cpu: 50m
        ports:
        - containerPort: 8080  # Prometheus metrics port
        - containerPort: 8081  # Health check port
        env:
        # Discord env vars
        #- name: EXPORTER_PORT
        #  value: '8080'
        #- name: HEALTH_PORT
        #  value: '8081'
        #- name: POLLING_INTERVAL
        #  value: '10'
        # Keeps the counters across container restarts
        - name: PERSIST_FILE
          value: '/data/counters.json'
        # Or in an S3 bucket, credentials from a Secret. Nothing is written on
        # disk then: remove the volumeMounts and volumes blocks below
        #- name: PERSIST_FILE
        #  value: 's3://<BUCKET>/discord/counters.json'
        #- name: AWS_ENDPOINT_URL  # Not on AWS: your S3 storage endpoint
        #  value: 'https://s3.<REGION>.io.cloud.ovh.net'
        #- name: AWS_REGION
        #  value: '<REGION>'
        #- name: AWS_ACCESS_KEY_ID
        #  valueFrom:
        #    secretKeyRef:
        #      name: discord-prometheus-exporter
        #      key: AWS_ACCESS_KEY_ID
        #- name: AWS_SECRET_ACCESS_KEY
        #  valueFrom:
        #    secretKeyRef:
        #      name: discord-prometheus-exporter
        #      key: AWS_SECRET_ACCESS_KEY
        - name: DISCORD_TOKEN
          value: '<YOUR_DISCORD_BOT_TOKEN>'
        # Other env vars
        - name: LOGURU_COLORIZE
          value: 'true'
        - name: LOGURU_DEBUG_COLOR
          value: '<cyan><bold>'
        - name: PYTHONUNBUFFERED
          value: 'True'
        - name: PYTHONIOENCODING
          value: 'UTF-8'
        - name: TZ
          value: 'Europe/Paris'
        #- name: LOGURU_LEVEL
        #  value: 'DEBUG'
        volumeMounts:
        - name: persist
          mountPath: /data
        # Healthcheck
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 60   # Allow time for Discord connection
          periodSeconds: 10
          failureThreshold: 3       # Restart after 3 consecutive failures
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 60
          periodSeconds: 5
          failureThreshold: 1       # Mark unready after 1 failure

      volumes:
      # Survives container restarts, not the pod's deletion (rollout, eviction,
      # node change): use a PersistentVolumeClaim to keep counters across those
      - name: persist
        emptyDir: {}
