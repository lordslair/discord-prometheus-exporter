# Builds and pushes the release Docker images (semver + latest)
# on every v* tag push

name: Pipeline Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# One release at a time, queued and never cancelled, so an older tag can never
# push its latest image after a newer one
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  tests:
    uses: ./.github/workflows/tests.yml

  build-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    needs:
    - lint
    - tests

    steps:
    - name: Checkout 🛎️
      uses: actions/checkout@v7

    - name: Log in to Docker Hub 🔐
      uses: docker/login-action@v4
      with:
        username: ${{ vars.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extracting Metadata 🔧
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ vars.DOCKER_USERNAME }}/discord-prometheus-exporter
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix=,suffix=,format=short
          type=raw,value=latest

    - name: Set up Docker Buildx 🧰
      uses: docker/setup-buildx-action@v4

    - name: Build 🏗️ & Push to Docker Hub 🚀
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        # Read-only: a tag's cache could only be reused by that same tag,
        # so reuse the one main's edge builds already filled instead
        cache-from: type=gha
