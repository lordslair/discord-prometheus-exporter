# This workflow will install Python dependencies, run tests with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Pipeline Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# One run at a time per PR / branch: a new push cancels the running PR run,
# while main runs are queued instead of cancelled, so an older run can never
# push its edge image after a newer one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout 🛎️
      uses: actions/checkout@v6

    # Pull requests only build the image, never push it
    - name: Log in to Docker Hub 🔐
      if: github.event_name == 'push'
      uses: docker/login-action@v3
      with:
        username: ${{ vars.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extracting Metadata 🔧
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ vars.DOCKER_USERNAME }}/discord-prometheus-exporter
        tags: |
          type=sha,prefix=,suffix=,format=short
          type=edge

    - name: Build 🏗️ & Push to Docker Hub 🚀
      uses: docker/build-push-action@v6
      with:
        context: .
        push: ${{ github.event_name == 'push' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
