# Lints and builds the Docker image on every push and pull request to main,
# and pushes the edge image (main pushes only). Run it manually on any branch
# for a dry run: lint + build, nothing is pushed

name: Pipeline Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# One run at a time per PR / branch: a new run cancels the running PR or
# dry run, while main pushes are queued instead of cancelled, so an older run
# can never push its edge image after a newer one. Dry runs get their own
# group, so they can never take a queued main push's place
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    needs:
    - lint

    steps:
    - name: Checkout 🛎️
      uses: actions/checkout@v6

    # Pull requests and dry runs only build the image, never push it
    - name: Log in to Docker Hub 🔐
      if: github.event_name == 'push'
      uses: docker/login-action@v3
      with:
        username: ${{ vars.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extracting Metadata 🔧
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ vars.DOCKER_USERNAME }}/discord-prometheus-exporter
        tags: |
          type=sha,prefix=,suffix=,format=short
          type=edge

    - name: Set up Docker Buildx 🧰
      uses: docker/setup-buildx-action@v4

    - name: Build 🏗️ & Push to Docker Hub 🚀
      uses: docker/build-push-action@v7
      with:
        context: .
        push: ${{ github.event_name == 'push' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
