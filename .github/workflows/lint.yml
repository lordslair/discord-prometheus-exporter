# Reusable lint job, called by the Pipeline Tests and Pipeline Release workflows

name: Lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout 🛎️
      uses: actions/checkout@v6

    # flake8 parses code with the running Python, so it must match the image's
    - name: Read Python version from Dockerfile 🔎
      id: pyver
      run: |
        echo "version=$(sed -nE 's/^FROM python:([0-9.]+)-.*/\1/p' Dockerfile | head -1)" >> "$GITHUB_OUTPUT"

    - name: Set up Python ${{ steps.pyver.outputs.version }} 🐍
      uses: actions/setup-python@v7
      with:
        python-version: ${{ steps.pyver.outputs.version }}
        cache: pip
        cache-dependency-path: requirements-lint.txt

    - name: Install requirements ⏬
      run: pip install -r requirements-lint.txt

    - name: Lint with flake8 📝
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
